<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <pattern id="horizontal-c" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 1H4" fill="none" stroke="#00AEEF" stroke-width="2" opacity=".5"/>
    </pattern>
    <pattern id="vertical-m" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M1 0V4" fill="none" stroke="#EC008C" stroke-width="2" opacity=".5"/>
    </pattern>
    <pattern id="diagonal-y" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M1 0V4" fill="none" stroke="#FFF200" stroke-width="2" opacity=".5"/>
    </pattern>
    <pattern id="diagonal-k" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(135)">
      <path d="M1 0V4" fill="none" stroke="#000000" stroke-width="2" opacity=".5"/>
    </pattern>
  </defs>
  <rect x="0" y="100" width="800" height="170" fill="url(#horizontal-c)"/>
  <rect x="345" y="0" width="180" height="800" fill="url(#vertical-m)"/>
